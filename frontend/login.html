
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SecureBank</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-info">

            <h1>SecureBank</h1>

            <h2>Welcome Back!</h2>

            <p>
                Access your account securely and manage your
                banking activities from anywhere.
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="login-box">

            <h2>Login</h2>

            <p class="subtitle">
                Enter your credentials to continue
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="form-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

<script src="js/login.js"></script>
</body>

</html>
