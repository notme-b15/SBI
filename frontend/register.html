```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SecureBank</title>

    <link rel="stylesheet" href="css/register.css">

</head>


<body>

    <div class="register-container">


        <!-- LEFT SIDE -->

        <div class="register-info">

            <h1>SecureBank</h1>

            <h2>Start Banking Today</h2>

            <p>
                Create your SecureBank account and
                experience simple and convenient
                online banking.
            </p>

        </div>


        <!-- REGISTER FORM -->

        <div class="register-box">

            <h2>Create Account</h2>

            <p class="subtitle">
                Fill in your details to get started
            </p>


            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            required
                        >

                        I agree to the Terms and Conditions

                    </label>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="register-btn"
                >
                    Create Account
                </button>


            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>

    </div>


    <script src="js/register.js"></script>

</body>

</html>
```
